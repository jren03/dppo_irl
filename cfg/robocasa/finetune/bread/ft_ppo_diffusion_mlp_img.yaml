defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.finetune.train_ppo_diffusion_img_agent.TrainPPOImgDiffusionAgent

name: ${env_name}_ft_diffusion_mlp_img${img_size}_demo${n_demos}_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/robocasa-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: /share/portal/sk3428/dppo_irl/log/robocasa-pretrain/bread_pre_diffusion_mlp_img96_demo15_ta4_td100/2025-05-01_13-02-16_42/checkpoint/state_20000.pt
# For 20 demos: /share/portal/sk3428/dppo_irl/log/robocasa-pretrain/bread_pre_diffusion_mlp_img96_demo20_ta4_td100/2025-04-01_00-22-28_42/checkpoint/state_20000.pt
# /share/portal/sk3428/dppo_irl/log/robocasa-pretrain/bread_pre_diffusion_mlp_img96_demo20_ta4_td100/2025-03-31_11-41-51_42/checkpoint/state_20000.pt
# /share/portal/sk3428/dppo_irl/log/robocasa-pretrain/bread_pre_diffusion_mlp_img96_demo20_ta4_td100/2025-03-27_16-12-36_42/checkpoint/state_20000.pt
robomimic_env_cfg_path: cfg/robocasa/env_meta/${env_name}-img.json
normalization_path: ${oc.env:DPPO_DATA_DIR}/robocasa/${env_name}-img${img_size}-${n_demos}demos-custom_norm/normalization.npz

seed: 42
device: cuda:0
env_name: bread
obs_dim: 9
action_dim: 12
denoising_steps: 100
ft_denoising_steps: 5
cond_steps: 1
img_cond_steps: 1
horizon_steps: 4
act_steps: 4
use_ddim: True

n_demos: 15 #25 #20
img_size: 96

shape_meta:
  obs:
    rgb:
      shape: [6, '${img_size}', '${img_size}']
    state:
      shape: [9]
  action: 
    shape: [12]

env:
  env_type: robocasa
  n_envs: 25 # 10 25  50
  name: ${env_name}
  best_reward_threshold_for_success: 1
  max_episode_steps: 200
  save_video: False
  use_image_obs: True
  wrappers:
    robocasa_image:
      normalization_path: ${normalization_path}
      low_dim_keys: ['robot0_eef_pos',
                     'robot0_eef_quat',
                     'robot0_gripper_qpos']
      image_keys: ['agentview_image', 'robot0_eye_in_hand_image']
      shape_meta: ${shape_meta}
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY}
  project: robomimic-${env_name}-finetune
  run: ${now:%H-%M-%S}_${name}

train:
  n_train_itr: 60 # 30 300K total env steps -> 300K / (n_envs * n_steps * act_steps) * 2 (consider evaluation) = 15
  n_critic_warmup_itr: 2
  n_steps: 200 # 300 same as max_episode_steps
  gamma: 0.999
  augment: True
  grad_accumulate: 1 # 15
  actor_lr: 5e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: ${train.n_train_itr}
    warmup_steps: 10
    min_lr: 5e-5
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: ${train.n_train_itr}
    warmup_steps: 10
    min_lr: 1e-3
  save_model_freq: 10 #100
  val_freq: 2
  render:
    freq: 1
    num: 0
  # PPO specific
  reward_scale_running: True
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 100 #500
  logprob_batch_size: 500
  update_epochs: 10
  vf_coef: 0.5
  target_kl: 1
  # Discriminator specific
  use_discriminator: True
  expert_dataset_path: ${oc.env:DPPO_DATA_DIR}/robocasa/${env_name}-img${img_size}-${n_demos}demos-custom_norm/train.npz
  discriminator:
    action_free: False
    n_discriminator_warmup_itr: 2 # 6 20% of 15 is 3 * 2 (eval mode)
    input_dim: ${eval:'${obs_dim} if ${train.discriminator.action_free} else (${obs_dim} + ${action_dim})'}
    hidden_dims: [256, 256]
    activation_type: "SiLU"
    lr: 1e-4
    lr_scheduler:
      first_cycle_steps: ${train.n_train_itr}
      warmup_steps: 10
      min_lr: 1e-5
    update_epochs: 2 #1 5
    batch_size: 100
    update_freq: 1
    grad_accumulate: 1 #15
    gp_scale: 5 # 10
    num_img: 2
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: [3, '${img_size}', '${img_size}']
      num_channel: ${eval:'3 * ${img_cond_steps}'} # each image patch is history concatenated
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0

model:
  _target_: model.diffusion.diffusion_ppo.PPODiffusion
  # HP to tune
  gamma_denoising: 0.99
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.001
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.1
  min_logprob_denoising_std: 0.1
  #
  use_ddim: ${use_ddim}
  ddim_steps: ${ft_denoising_steps}
  learn_eta: False
  eta:
    base_eta: 1
    input_dim: ${obs_dim}
    mlp_dims: [256, 256]
    action_dim: ${action_dim}
    min_eta: 0.1
    max_eta: 1.0
    _target_: model.diffusion.eta.EtaFixed
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.mlp_diffusion.VisionDiffusionMLP
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: [3, '${img_size}', '${img_size}']
      num_channel: ${eval:'3 * ${img_cond_steps}'} # each image patch is history concatenated
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    num_img: 2
    augment: False
    spatial_emb: 128
    time_dim: 32
    mlp_dims: [512, 512, 512]
    residual_style: True
    img_cond_steps: ${img_cond_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.ViTCritic
    spatial_emb: 128
    augment: False
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: [3, '${img_size}', '${img_size}']
      num_channel: ${eval:'3 * ${img_cond_steps}'} # each image patch is history concatenated
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    num_img: 2
    img_cond_steps: ${img_cond_steps}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}